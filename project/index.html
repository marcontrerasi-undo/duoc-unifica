<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)',
          surface: 'var(--surface)',
          'surface-2': 'var(--surface-2)',
          line: 'var(--border)',
          ink: 'var(--text)',
          muted: 'var(--text-muted)',
          faint: 'var(--text-faint)',
          primary: 'var(--primary)',
          'primary-soft': 'var(--primary-soft)',
          accent: 'var(--accent)',
          'accent-ink': 'var(--accent-ink)',
          high: 'var(--high)',
          'high-soft': 'var(--high-soft)',
          medium: 'var(--medium)',
          'medium-soft': 'var(--medium-soft)',
          low: 'var(--low)',
          'low-soft': 'var(--low-soft)',
          ok: 'var(--ok)',
        },
        fontFamily: {
          display: 'var(--font-display)',
          sans: 'var(--font-body)',
        },
        borderRadius: {
          xl: '11px',
          '2xl': '15px',
          '3xl': '20px',
        },
        boxShadow: {
          card: 'var(--shadow-card)',
          float: 'var(--shadow-float)',
        },
      },
    },
  };
</script>
<style>
  :root {
    --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body: 'Manrope', system-ui, sans-serif;

    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f5f7fa;
    --border: #e4e8ef;
    --text: #0f1b2d;
    --text-muted: #56657c;
    --text-faint: #8a99ad;

    --primary: #1a1a1a;
    --primary-soft: #ededed;
    --on-primary: #ffffff;

    --accent: #ffb800;
    --accent-ink: #5a4300;

    --high: #e0454b;
    --high-soft: #fdecec;
    --medium: #d98300;
    --medium-soft: #fdf1dd;
    --low: #4f7bd6;
    --low-soft: #eaf1fc;
    --ok: #1f9d6b;

    --cat-inst: #c79100;

    --shadow-card: none;
    --shadow-float: 0 18px 50px -26px rgba(16, 32, 60, 0.30);
  }

  html.dark {
    --bg: #08090c;
    --surface: #101216;
    --surface-2: #15181d;
    --border: #23262e;
    --text: #ecedf0;
    --text-muted: #9a9ea8;
    --text-faint: #65696f;

    --primary: #f1f1ef;
    --primary-soft: #232a34;
    --on-primary: #1a1a1a;

    --accent: #ffc233;
    --accent-ink: #3a2c00;

    --high: #f06a6f;
    --high-soft: #2e1b1f;
    --medium: #eaa53a;
    --medium-soft: #2c2316;
    --low: #6b97e6;
    --low-soft: #182338;
    --ok: #3cc28a;

    --cat-inst: #f2c84b;

    --shadow-card: none;
    --shadow-float: 0 22px 60px -28px rgba(0, 0, 0, 0.80);
  }

  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .font-display { font-family: var(--font-display); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Animations */
  /* Transform-only: never animate opacity from 0, so content can't trap invisible in frozen captures */
  @keyframes fadeUp { from { transform: translateY(12px); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { transform: translateY(5px); } to { transform: translateY(0); } }
  @keyframes scaleIn { from { transform: scale(.97); } to { transform: scale(1); } }
  @keyframes slideInRight { from { transform: translateX(26px); } to { transform: translateX(0); } }
  @keyframes slideInLeft { from { transform: translateX(-26px); } to { transform: translateX(0); } }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(255,184,0,.45); } 70% { box-shadow: 0 0 0 14px rgba(255,184,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,184,0,0); } }
  @keyframes shimmer { 100% { background-position: 200% 0; } }

  /* Resting state is VISIBLE; animation plays from hidden as an enhancement.
     No backwards/both fill, so if the animation engine is paused (screenshots,
     PDF, verifier) the content stays visible instead of trapping at opacity 0. */
  .anim-fade-up, .anim-fade-in, .anim-scale-in, .anim-slide-right, .anim-slide-left { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .anim-fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) backwards; }
    .anim-fade-in { animation: fadeIn .4s ease backwards; }
    .anim-scale-in { animation: scaleIn .32s cubic-bezier(.22,1,.36,1) backwards; }
    .anim-slide-right { animation: slideInRight .45s cubic-bezier(.22,1,.36,1) backwards; }
    .anim-slide-left { animation: slideInLeft .45s cubic-bezier(.22,1,.36,1) backwards; }
  }
  .pulse-ring { animation: pulseRing 2s ease-out infinite; }

  @keyframes qrScan { 0% { top: 14px; } 50% { top: calc(100% - 16px); } 100% { top: 14px; } }
  .qr-scan { animation: qrScan 1.6s cubic-bezier(.45,0,.55,1) infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    html { scroll-behavior: auto; }
  }

  .stripe-placeholder {
    background-image: repeating-linear-gradient(135deg, var(--surface-2) 0, var(--surface-2) 10px, transparent 10px, transparent 20px);
  }
  .focus-ring:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 10px; }

  [data-tour-highlight] { position: relative; z-index: 60; border-radius: 16px; box-shadow: 0 0 0 4px var(--primary), 0 0 0 9999px rgba(7, 14, 26, 0.62); transition: box-shadow .3s ease; }
  html.dark [data-tour-highlight] { box-shadow: 0 0 0 4px var(--primary), 0 0 0 9999px rgba(0,0,0,.74); }
</style>
