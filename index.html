// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');

    const startBottom = window.innerHeight - r.bottom;

    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const URGENCY = {

// Hoja inferior / modal con animación
function Sheet({ open, onClose, children, side = 'center', label }) {

// src/auth-methods.jsx — Flujos reales de acceso: Biometría (huella) y Código QR
// Exporta window.BiometricSheet y window.QRSheet
const { useState: useStateAuth, useEffect: useEffectAuth, useRef: useRefAuth } = React;

/* ============================================================
   BIOMETRÍA — mantener presionado el sensor → lectura → verificación
   ============================================================ */
function BiometricSheet({ open, onClose, onLogin }) {
  const { Sheet, Icon } = window;
  // 'idle' | 'scanning' | 'success' | 'error'
  const [phase, setPhase] = useStateAuth('idle');
  const [pct, setPct] = useStateAuth(0);
  const rafRef = useRefAuth(null);
  const startRef = useRefAuth(0);
  const DURATION = 1500;

  // Reinicia el estado cada vez que se abre
  useEffectAuth(() => {
    if (open) { setPhase('idle'); setPct(0); }
    return () => cancelAnimationFrame(rafRef.current);
  }, [open]);

  const stopRAF = () => { cancelAnimationFrame(rafRef.current); rafRef.current = null; };

  const tick = (now) => {
    const elapsed = now - startRef.current;
    const p = Math.min(1, elapsed / DURATION);
    setPct(p);
    if (p >= 1) {
      stopRAF();
      setPhase('success');
      setTimeout(() => onLogin && onLogin(), 1050);
    } else {
      rafRef.current = requestAnimationFrame(tick);
    }
  };

  const beginScan = () => {
    if (phase === 'success' || phase === 'scanning') return;
    setPhase('scanning');
    startRef.current = performance.now();
    rafRef.current = requestAnimationFrame(tick);
  };

  // Soltar antes de completar = lectura incompleta
  const releaseScan = () => {
    if (phase !== 'scanning') return;
    stopRAF();
    setPhase('error');
    setPct(0);
  };

  const R = 86, C = 2 * Math.PI * R;
  const ringColor = phase === 'success' ? 'var(--ok)' : phase === 'error' ? 'var(--high)' : 'var(--accent)';

  const status = {
    idle:     { t: 'Mantén presionado el sensor', s: 'Coloca el dedo y no lo sueltes hasta completar la lectura.' },
    scanning: { t: 'Leyendo tu huella…', s: 'Mantén el dedo en su lugar.' },
    success:  { t: 'Identidad verificada', s: 'Bienvenido de nuevo, Francisco Reyes.' },
    error:    { t: 'Lectura incompleta', s: 'Soltaste antes de tiempo. Vuelve a intentarlo.' },
  }[phase];

  if (!open) return null;

  return (
    <Sheet open={open} onClose={onClose} label="Acceso con biometría">
      <div className="relative w-full max-w-[420px] mx-4 bg-surface rounded-3xl shadow-float border border-line p-7 sm:p-9 anim-scale-in text-center">
        <button onClick={onClose} aria-label="Cerrar"
          className="absolute top-4 right-4 grid place-items-center w-10 h-10 rounded-xl text-faint hover:bg-surface-2 hover:text-ink transition-all focus-ring">
          <Icon name="close" size={20} />
        </button>

        <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-6 text-[11px] font-bold tracking-[0.14em] uppercase bg-primary-soft text-primary">
          <Icon name="shield" size={14} /> Acceso biométrico
        </div>

        {/* Sensor */}
        <div className="relative mx-auto grid place-items-center select-none"
          style={{ width: 210, height: 210, touchAction: 'none' }}
          onPointerDown={beginScan}
          onPointerUp={releaseScan}
          onPointerLeave={releaseScan}
          role="button" aria-label="Sensor de huella">

          <svg width="210" height="210" viewBox="0 0 210 210" className="absolute inset-0 -rotate-90">
            <circle cx="105" cy="105" r={R} fill="none" stroke="var(--surface-2)" strokeWidth="7" />
            <circle cx="105" cy="105" r={R} fill="none" stroke={ringColor} strokeWidth="7" strokeLinecap="round"
              strokeDasharray={C}
              strokeDashoffset={phase === 'success' ? 0 : C * (1 - pct)}
              style={{ transition: phase === 'scanning' ? 'none' : 'stroke-dashoffset .4s ease, stroke .3s ease' }} />
          </svg>

          {/* Halo / disco del sensor */}
          <div className="relative grid place-items-center rounded-full transition-colors duration-300"
            style={{
              width: 150, height: 150,

   CÓDIGO QR — emparejamiento con el teléfono

// Matriz QR-like determinista (con los tres "ojos" en las esquinas)
function makeMatrix(n, seed) {
  const m = Array.from({ length: n }, () => Array(n).fill(false));
  let s = seed;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let y = 0; y < n; y++)
    for (let x = 0; x < n; x++)
      m[y][x] = rnd() > 0.52;
  const eye = (oy, ox) => {
    for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
      const border = x === 0 || x === 6 || y === 0 || y === 6;
      const center = x >= 2 && x <= 4 && y >= 2 && y <= 4;
      m[oy + y][ox + x] = border || center;
    }
    for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
      if ((x === -1 || x === 7 || y === -1 || y === 7) && oy + y >= 0 && oy + y < n && ox + x >= 0 && ox + x < n)
        m[oy + y][ox + x] = false;
    }
  };
  eye(0, 0); eye(0, n - 7); eye(n - 7, 0);
  return m;
}

function QRCanvas({ active }) {
  const N = 25;
  const matrix = useRefAuth(makeMatrix(N, 7919)).current;
  return (
    <div className="relative rounded-2xl bg-white p-3.5" style={{ width: 230, height: 230 }}>
      <div className="grid w-full h-full" style={{ gridTemplateColumns: `repeat(${N}, 1fr)`, gap: 0 }}>
        {matrix.flatMap((row, y) => row.map((on, x) => (
          <div key={`${y}-${x}`} style={{ background: on ? '#0b0b0c' : 'transparent', borderRadius: 1 }}></div>
        )))}
      </div>
      {/* Logo central */}

          <span className="font-display font-extrabold text-[#1a1a1a]" style={{ fontSize: 18 }}>U</span>
        </div>

      {/* Línea de escaneo */}
      {active && (
        <div className="absolute left-3.5 right-3.5 rounded-full qr-scan" style={{ height: 3, background: 'var(--accent)', boxShadow: '0 0 12px 2px var(--accent)' }}></div>
      )}
    </div>
  );
}

function QRSheet({ open, onClose, onLogin }) {

// src/onboarding.jsx — Tour guiado (spotlight) → window.OnboardingTour
const { useState: useStateTour, useEffect: useEffectTour, useCallback: useCbTour, useRef: useRefTour } = React;

function clearTourHighlights() {
  document.querySelectorAll('[data-tour-highlight]').forEach((el) => el.removeAttribute('data-tour-highlight'));
}

function OnboardingTour({ steps, onFinish, onSkip }) {
  const { Icon, Button } = window;
  const [i, setI] = useStateTour(0);
  const [rect, setRect] = useStateTour(null);
  const [mobile, setMobile] = useStateTour(window.innerWidth < 1024);
  const timerRef = useRefTour(null);
  const mountedRef = useRefTour(true);
  const step = steps[i];

  const measure = useCbTour(() => {
    setMobile(window.innerWidth < 1024);
    clearTourHighlights();
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    const el = document.querySelector(`[data-tour="${step.target}"]`);
    if (!el) { setRect(null); return; }
    const r = el.getBoundingClientRect();
    // asegurar visibilidad
    if (r.top < 80 || r.bottom > window.innerHeight - 80) {
      window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * 0.35, behavior: 'smooth' });
      timerRef.current = setTimeout(() => {
        if (!mountedRef.current) return;
        const rr = el.getBoundingClientRect();
        el.setAttribute('data-tour-highlight', '');
        setRect({ top: rr.top, left: rr.left, width: rr.width, height: rr.height, bottom: rr.bottom, right: rr.right });
      }, 320);
      return;
    }
    el.setAttribute('data-tour-highlight', '');
    setRect({ top: r.top, left: r.left, width: r.width, height: r.height, bottom: r.bottom, right: r.right });
  }, [step]);

  useEffectTour(() => {
    measure();
    window.addEventListener('resize', measure);
    window.addEventListener('scroll', measure, true);
    return () => { window.removeEventListener('resize', measure); window.removeEventListener('scroll', measure, true); };
  }, [measure]);

  useEffectTour(() => () => {
    // Desmontaje: cancelar timers pendientes y limpiar el spotlight pase lo que pase
    mountedRef.current = false;
    if (timerRef.current) clearTimeout(timerRef.current);
    clearTourHighlights();
  }, []);

  const next = () => { if (i < steps.length - 1) setI(i + 1); else finish(); };
  const prev = () => i > 0 && setI(i - 1);
  const finish = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    clearTourHighlights();
    onFinish();
  };
  const skip = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    clearTourHighlights();
    (onSkip || onFinish)();
  };

  // Posición de la tarjeta
  let cardStyle = {};
  if (mobile || !rect) {
    cardStyle = { left: '50%', bottom: 16, transform: 'translateX(-50%)', width: 'min(92vw, 380px)' };
  } else {
    const W = 340, gap = 18;
    let top, left;
    if (step.pos === 'bottom') { top = rect.bottom + gap; left = rect.left; }
    else if (step.pos === 'top') { top = rect.top - gap; left = rect.left; }
    else if (step.pos === 'left') { top = rect.top; left = rect.left - W - gap; }
    else { top = rect.top; left = rect.right + gap; }
    left = Math.max(16, Math.min(left, window.innerWidth - W - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - 280));
    cardStyle = { top, left, width: W, transform: step.pos === 'top' ? 'translateY(-100%)' : 'none' };
  }

  return (
    <div className="fixed inset-0 z-[70]">
      {/* scrim cuando no hay target (primer frame) */}
      {!rect && <div className="absolute inset-0 bg-[rgba(7,14,26,0.62)]"></div>}

      <div key={i} className="fixed z-[75] anim-scale-in" style={cardStyle}>
        <div className="bg-surface rounded-2xl shadow-float border border-line overflow-hidden">
          <div className="h-1.5 w-full bg-surface-2">
            <div className="h-full bg-primary transition-all duration-500" style={{ width: `${((i + 1) / steps.length) * 100}%` }}></div>
          </div>
          <div className="p-5">
            <div className="flex items-center gap-3 mb-3">
              <div className="grid place-items-center rounded-xl bg-primary-soft pulse-ring" style={{ width: 42, height: 42 }}>
                <Icon name={step.icon} size={21} className="text-primary" />
              </div>
              <div className="flex items-center gap-1.5">
                {steps.map((_, idx) => (
                  <span key={idx} className="rounded-full transition-all duration-300" style={{ width: idx === i ? 20 : 7, height: 7, background: idx === i ? 'var(--primary)' : idx < i ? 'var(--primary)' : 'var(--border)', opacity: idx <= i ? 1 : .6 }}></span>
                ))}
              </div>

          </div>
        </div>
      </div>
    </div>
  );
}

// ---- Asistencia del curso: métrica independiente del progreso académico ----
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function computeAttendance(course) {
  const a = course.asistencia || { minimo: 75, total: 0, asistidas: 0, inasistencias: 0 };
  const realizadas = a.asistidas + a.inasistencias;
  const restantes = Math.max(0, a.total - realizadas);
  const maxFaltas = Math.floor(a.total * (1 - a.minimo / 100));
  const puedeFaltar = Math.max(0, maxFaltas - a.inasistencias);
  const pct = realizadas > 0 ? Math.round((a.asistidas / realizadas) * 100) : 100;
  const enRiesgo = puedeFaltar <= 1 || pct < a.minimo;
  return { ...a, realizadas, restantes, maxFaltas, puedeFaltar, pct, enRiesgo };
}

function buildSessions(course, m) {
  const sesiones = [];
  // Marca de inasistencias: distribuidas, nunca en la sesión más reciente
  const ausentes = new Set();
  let placed = 0, idx = 1;
  while (placed < m.inasistencias && idx < m.realizadas) { ausentes.add(idx); placed++; idx += 2; }
  let idx2 = 2;
  while (placed < m.inasistencias) { if (!ausentes.has(idx2)) { ausentes.add(idx2); placed++; } idx2++; }

  const base = new Date(2026, 5, 11); // referencia: clase más reciente
  for (let i = 0; i < m.realizadas; i++) {
    const d = new Date(base.getTime() - i * 7 * 86400000);
    sesiones.push({
      n: m.realizadas - i,
      fecha: `${d.getDate()} ${MESES[d.getMonth()]}`,
      ausente: ausentes.has(i),
    });
  }
  return sesiones;
}

// src/app.jsx — Shell, navegación, búsqueda global, ajustes y Tweaks
const { useState, useEffect, useRef, useCallback } = React;

const FONT_MAP = {
  'Editorial': { d: "'Newsreader', Georgia, 'Times New Roman', serif", b: "'Manrope', system-ui, sans-serif" },
  'Moderno': { d: "'Plus Jakarta Sans', system-ui, sans-serif", b: "'Manrope', system-ui, sans-serif" },
  'Geométrico': { d: "'Sora', system-ui, sans-serif", b: "'Manrope', system-ui, sans-serif" },
};
const PRIMARY_OPTS = ['#1a1a1a', '#0e4fb8', '#7b3ff2'];

function relLum(hex) {
  const c = (hex || '#1a1a1a').replace('#', '');
  const n = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
  const r = parseInt(n.slice(0, 2), 16) / 255, g = parseInt(n.slice(2, 4), 16) / 255, b = parseInt(n.slice(4, 6), 16) / 255;
  const f = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "Claro",
  "font": "Editorial",
  "primary": "#1a1a1a"
}/*EDITMODE-END*/;

const NAV = [
  { id: 'inicio', icon: 'home', label: 'Inicio' },
  { id: 'cursos', icon: 'book', label: 'Cursos' },
  { id: 'ayuda', icon: 'support', label: 'Ayuda' },
];

function App() {
  const { Logo, Button, IconButton, Icon, Card, Badge, Avatar, CourseGlyph, Progress, Sheet, Tooltip } = window;
  const { LoginScreen, DashboardScreen, CourseScreen, HelpScreen, OnboardingTour } = window;
  const { STUDENT, NOTIFICATIONS, SEARCH_INDEX, QUICK_ACTIONS, HELP_POPULAR } = window.DATA;

  const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [logged, setLogged] = useState(false);
  const [route, setRoute] = useState('inicio');
  const [courseId, setCourseId] = useState(null);
  const [courseTab, setCourseTab] = useState(null);
  const [tour, setTour] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifs, setNotifs] = useState(NOTIFICATIONS);

  // Aplicar Tweaks → tokens
  useEffect(() => {
    document.documentElement.classList.toggle('dark', t.theme === 'Oscuro');
  }, [t.theme]);
  useEffect(() => {
    const f = FONT_MAP[t.font] || FONT_MAP.Editorial;
    document.documentElement.style.setProperty('--font-display', f.d);
    document.documentElement.style.setProperty('--font-body', f.b);
  }, [t.font]);
  useEffect(() => {
    const root = document.documentElement;
    const dark = t.theme === 'Oscuro';
    const base = t.primary || '#1a1a1a';
    const lum = relLum(base);
    // Mantener el primario visible sobre superficies oscuras (si es muy oscuro, se aclara en modo oscuro)
    const eff = dark && lum < 0.22 ? '#f1f1ef' : (!dark && lum > 0.82 ? '#1a1a1a' : base);
    const onP = relLum(eff) > 0.55 ? '#1a1a1a' : '#ffffff';
    root.style.setProperty('--primary', eff);
    root.style.setProperty('--on-primary', onP);
    root.style.setProperty('--primary-soft', `color-mix(in srgb, ${eff} ${dark ? 16 : 13}%, var(--surface))`);
  }, [t.primary, t.theme]);

  // ⌘K búsqueda global
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (logged) setSearchOpen(true); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [logged]);

  const navigate = (r) => { setRoute(r); setCourseId(null); window.scrollTo({ top: 0 }); };
  const openCourse = (id, tab = null) => { setCourseId(id); setCourseTab(tab); setRoute('curso'); window.scrollTo({ top: 0 }); };
  const dismiss = (id) => setNotifs((ns) => ns.filter((n) => n.id !== id));

  const login = () => {
    setLogged(true);
    const onboarded = safeGet('duoc_onboarded');
    if (!onboarded) setTimeout(() => setTour(true), 700);
  };
  const finishTour = () => { setTour(false); safeSet('duoc_onboarded', '1'); };
  const reactivateTour = () => { setSettingsOpen(false); navigate('inicio'); setTimeout(() => setTour(true), 500); };

  if (!logged) return (<><LoginScreen onLogin={login} /><TweaksUI t={t} setTweak={setTweak} /></>);

  const unread = notifs.filter((n) => n.urgencia === 'alta').length;

        <nav className="flex-1 p-3 space-y-1">
          {NAV.map((n) => {
            const active = route === n.id || (n.id === 'cursos' && route === 'curso');

                <Icon name={n.icon} size={20} /> {n.label}
              </button>
            );

          <button onClick={() => setNotifOpen(true)}
            className={`w-full flex items-center gap-3 px-3.5 h-12 rounded-xl font-semibold text-[14.5px] transition-all ${notifOpen ? 'bg-primary-soft text-primary' : 'text-muted hover:bg-surface-2 hover:text-ink'}`}>
            <Icon name="bell" size={20} /> Notificaciones
            {unread > 0 && <span className="ml-auto min-w-[20px] h-5 px-1.5 grid place-items-center rounded-full bg-high text-white text-[11px] font-bold">{unread}</span>}
          </button>
          <div className="pt-3 mt-3 border-t border-line">
            <button onClick={() => setSearchOpen(true)} className="w-full flex items-center gap-3 px-3.5 h-12 rounded-xl font-semibold text-[14.5px] text-muted hover:bg-surface-2 hover:text-ink transition-all">
              <Icon name="search" size={20} /> Buscar <span className="ml-auto text-[11px] font-bold text-faint px-1.5 py-0.5 rounded bg-surface-2 border border-line">⌘K</span>
            </button>
          </div>
        </nav>
        {/* Perfil */}
        <div className="p-3 border-t border-line">
          <button onClick={() => setSettingsOpen(true)} className="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-surface-2 transition-all text-left">
            <Avatar iniciales={STUDENT.iniciales} size={40} textColor="var(--on-primary)" />
            <div className="min-w-0 flex-1">
              <div className="font-bold text-ink text-[13.5px] truncate">{STUDENT.nombre}</div>

            <Icon name="settings" size={18} className="text-faint shrink-0" />
          </button>
        </div>
      </aside>

      {/* Columna principal */}
      <div className="flex-1 min-w-0 flex flex-col">
        {/* Topbar */}

          <span data-tour="tour-notifs" className="inline-flex"><Tooltip label="Notificaciones"><IconButton name="bell" label="Notificaciones" badge={unread} onClick={() => setNotifOpen(true)} /></Tooltip></span>
          <button onClick={() => setSettingsOpen(true)} className="lg:hidden"><Avatar iniciales={STUDENT.iniciales} size={38} textColor="var(--on-primary)" /></button>

        </main>

      <nav className="lg:hidden fixed bottom-0 inset-x-0 z-40 h-[64px] bg-[color-mix(in_srgb,var(--surface)_92%,transparent)] backdrop-blur-md border-t border-line flex items-center justify-around px-2" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
        {NAV.map((n) => {

      <NotificationsPanel open={notifOpen} onClose={() => setNotifOpen(false)} notifs={notifs} onDismiss={dismiss} onCourse={(id, tab) => { setNotifOpen(false); openCourse(id, tab); }} onNavigate={(r) => { setNotifOpen(false); navigate(r); }} />

      {/* Ajustes */}
      <SettingsSheet open={settingsOpen} onClose={() => setSettingsOpen(false)} t={t} setTweak={setTweak} onReactivateTour={reactivateTour} onLogout={() => { setSettingsOpen(false); setLogged(false); setRoute('inicio'); }} />

      {/* Tour onboarding */}
      {tour && <OnboardingTour steps={window.DATA.TOUR_STEPS} onFinish={finishTour} onSkip={finishTour} />}

      {/* Tweaks */}
      <TweaksUI t={t} setTweak={setTweak} />
    </div>
  );
}

// ---- Command palette ----
function CommandPalette({ onClose, onPick }) {
  const { Icon } = window;
  const { SEARCH_INDEX } = window.DATA;
  const [q, setQ] = useState('');
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const results = SEARCH_INDEX.filter((s) => (s.titulo + s.sub + s.tipo).toLowerCase().includes(q.toLowerCase()));
  const groups = results.reduce((acc, r) => { (acc[r.tipo] = acc[r.tipo] || []).push(r); return acc; }, {});
  return (
    <div className="fixed inset-0 z-[85] flex items-start justify-center pt-[12vh] px-4 anim-fade-in">
      <div className="absolute inset-0 bg-[rgba(8,15,28,0.5)] backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative w-full max-w-[600px] bg-surface rounded-2xl shadow-float border border-line overflow-hidden anim-scale-in">
        <div className="flex items-center gap-3 px-5 h-16 border-b border-line">
          <Icon name="search" size={22} className="text-primary" />
          <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Busca cursos, trámites, recursos o personas…" className="flex-1 bg-transparent outline-none text-ink text-[16px] font-medium placeholder:text-faint" />
          <kbd className="text-[11px] font-bold text-faint px-2 py-1 rounded bg-surface-2 border border-line">Esc</kbd>
        </div>
        <div className="max-h-[52vh] overflow-y-auto p-2">
          {results.length === 0 && <div className="text-center py-10 text-muted text-[14px]">Sin resultados para “{q}”.</div>}
          {Object.entries(groups).map(([tipo, items]) => (
            <div key={tipo} className="mb-1">
              <p className="text-[10.5px] font-bold text-faint uppercase tracking-wide px-3 pt-2 pb-1">{tipo}</p>
              {items.map((item, i) => (
                <button key={i} onClick={() => onPick(item)} className="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-surface-2 text-left transition-colors group" style={{ minHeight: 44 }}>
                  <div className="grid place-items-center rounded-lg bg-primary-soft shrink-0" style={{ width: 38, height: 38 }}><Icon name={item.icon} size={18} className="text-primary" /></div>
                  <div className="flex-1 min-w-0"><p className="text-ink font-semibold text-[14px] truncate">{item.titulo}</p><p className="text-faint text-[12px] truncate">{item.sub}</p></div>
                  <Icon name="arrowRight" size={16} className="text-faint opacity-0 group-hover:opacity-100 transition-opacity" />
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="px-5 h-11 border-t border-line flex items-center gap-4 text-[11.5px] text-faint font-medium">
          <span className="flex items-center gap-1.5"><kbd className="px-1.5 py-0.5 rounded bg-surface-2 border border-line">↵</kbd> abrir</span>
          <span className="flex items-center gap-1.5"><kbd className="px-1.5 py-0.5 rounded bg-surface-2 border border-line">esc</kbd> cerrar</span>
          <span className="ml-auto">Búsqueda unificada</span>
        </div>
      </div>
    </div>
  );
}

// ---- Hoja de ajustes ----
function SettingsSheet({ open, onClose, t, setTweak, onReactivateTour, onLogout }) {
  const { Sheet, Icon, Avatar, Button } = window;
  const { STUDENT } = window.DATA;
  return (
    <Sheet open={open} onClose={onClose} side="right" label="Ajustes">
      <div className="relative h-screen w-full max-w-[400px] bg-surface border-l border-line shadow-float overflow-y-auto anim-slide-right">
        <div className="sticky top-0 bg-surface border-b border-line px-5 h-[60px] flex items-center justify-between z-10">
          <h2 className="font-display font-bold text-ink text-[18px]">Ajustes</h2>
          <button onClick={onClose} aria-label="Cerrar" className="grid place-items-center rounded-xl hover:bg-surface-2 text-muted" style={{ width: 40, height: 40 }}><Icon name="close" size={20} /></button>
        </div>
        <div className="p-5 space-y-6">
          <div className="flex items-center gap-3.5">
            <Avatar iniciales={STUDENT.iniciales} size={56} textColor="var(--on-primary)" />
            <div className="min-w-0">
              <div className="font-display font-bold text-ink text-[16px]">{STUDENT.nombre}</div>
              <div className="text-faint text-[12.5px]">{STUDENT.rut} · {STUDENT.jornada}</div>
              <div className="text-primary text-[12.5px] font-semibold mt-0.5">{STUDENT.carrera}</div>
            </div>
          </div>

          <SettingsGroup title="Apariencia">
            <SettingRow icon={t.theme === 'Oscuro' ? 'moon' : 'sun'} label="Modo oscuro" desc="Ideal para estudiar de noche">
              <ToggleSwitch on={t.theme === 'Oscuro'} onChange={() => setTweak('theme', t.theme === 'Oscuro' ? 'Claro' : 'Oscuro')} />
            </SettingRow>
            <SettingRow icon="globe" label="Idioma" desc="Español (Chile)"><Icon name="chevronRight" size={18} className="text-faint" /></SettingRow>
          </SettingsGroup>

          <SettingsGroup title="Onboarding y ayuda">
            <button onClick={onReactivateTour} className="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-surface-2 transition-colors text-left" style={{ minHeight: 44 }}>
              <div className="grid place-items-center rounded-xl bg-primary-soft" style={{ width: 38, height: 38 }}><Icon name="play" size={17} className="text-primary" /></div>
              <div className="flex-1"><div className="font-semibold text-ink text-[14px]">Reactivar tour guiado</div><div className="text-faint text-[12px]">Vuelve a ver las 5 funciones clave</div></div>
              <Icon name="chevronRight" size={18} className="text-faint" />
            </button>
            <SettingRow icon="support" label="Centro de ayuda" desc="Guías, chat y estado de servicios"><Icon name="chevronRight" size={18} className="text-faint" /></SettingRow>
          </SettingsGroup>

          <SettingsGroup title="Cuenta">
            <SettingRow icon="shield" label="Seguridad y acceso" desc="Contraseña, biometría, sesiones"><Icon name="chevronRight" size={18} className="text-faint" /></SettingRow>
            <SettingRow icon="bell" label="Notificaciones" desc="Preferencias de alertas"><Icon name="chevronRight" size={18} className="text-faint" /></SettingRow>
          </SettingsGroup>

          <button onClick={onLogout} className="w-full flex items-center justify-center gap-2 h-12 rounded-xl bg-high-soft text-high font-bold text-[14px] hover:brightness-95 transition-all" style={{ minHeight: 44 }}>
            <Icon name="logout" size={18} /> Cerrar sesión
          </button>
          <p className="text-center text-faint text-[11.5px]">Duoc Unifica · v1.0 · Prototipo</p>
        </div>
      </div>
    </Sheet>
  );
}

function SettingsGroup({ title, children }) {
  return (<div><p className="text-[11px] font-bold text-faint uppercase tracking-wide mb-2 ml-1">{title}</p><div className="bg-surface-2 rounded-2xl p-1.5 space-y-0.5">{children}</div></div>);
}
function SettingRow({ icon, label, desc, children }) {
  const { Icon } = window;
  return (
    <div className="flex items-center gap-3 p-3 rounded-xl">
      <div className="grid place-items-center rounded-xl bg-surface" style={{ width: 38, height: 38 }}><Icon name={icon} size={17} className="text-primary" /></div>
      <div className="flex-1 min-w-0"><div className="font-semibold text-ink text-[14px]">{label}</div>{desc && <div className="text-faint text-[12px]">{desc}</div>}</div>
      {children}
    </div>
  );
}
function ToggleSwitch({ on, onChange }) {
  return (
    <button onClick={onChange} role="switch" aria-checked={on} className="relative rounded-full transition-colors shrink-0" style={{ width: 46, height: 28, background: on ? 'var(--primary)' : 'var(--border)' }}>
      <span className="absolute top-1 rounded-full shadow transition-all" style={{ width: 20, height: 20, left: on ? 22 : 4, background: on ? 'var(--on-primary)' : '#fff' }}></span>
    </button>
  );
}

// ---- Panel de notificaciones (slide-over izquierdo) ----
function NotificationsPanel({ open, onClose, notifs, onDismiss, onCourse, onNavigate }) {
  const { Sheet, Icon, Badge, URGENCY } = window;
  const CATS = window.DATA.NOTIF_CATEGORIES;
  const [filterUrgent, setFilterUrgent] = useState(false);
  const order = { alta: 0, media: 1, baja: 2 };
  const list = [...notifs].filter((n) => (filterUrgent ? n.urgencia === 'alta' : true)).sort((a, b) => order[a.urgencia] - order[b.urgencia]);
  const altas = notifs.filter((n) => n.urgencia === 'alta').length;
  return (
    <Sheet open={open} onClose={onClose} side="left" label="Notificaciones">
      <div className="relative h-screen w-full max-w-[400px] bg-surface border-r border-line shadow-float overflow-y-auto anim-slide-left">
        <div className="sticky top-0 bg-surface border-b border-line px-5 h-[60px] flex items-center justify-between z-10">
          <div className="flex items-center gap-2">
            <h2 className="font-display font-bold text-ink text-[18px] flex items-center gap-2"><Icon name="bell" size={19} className="text-primary" /> Notificaciones</h2>
            {altas > 0 && <Badge tone="high">{altas}</Badge>}
          </div>
          <button onClick={onClose} aria-label="Cerrar" className="grid place-items-center rounded-xl hover:bg-surface-2 text-muted" style={{ width: 40, height: 40 }}><Icon name="close" size={20} /></button>
        </div>

        <div className="px-4 pt-4 flex items-center justify-between">
          <div className="flex items-center gap-1 p-1 rounded-xl bg-surface-2">
            <button onClick={() => setFilterUrgent(false)} className={`px-3 h-8 rounded-lg text-[12.5px] font-bold transition-all ${!filterUrgent ? 'bg-surface text-ink shadow-card' : 'text-faint'}`}>Todas</button>
            <button onClick={() => setFilterUrgent(true)} className={`px-3 h-8 rounded-lg text-[12.5px] font-bold transition-all ${filterUrgent ? 'bg-high-soft text-high' : 'text-faint'}`}>Urgentes</button>
          </div>
          <span className="text-[12px] font-semibold text-faint">{list.length} activa{list.length !== 1 ? 's' : ''}</span>
        </div>

        {/* Leyenda de categorías por origen */}
        <div className="px-4 pt-3 flex flex-wrap items-center gap-x-3.5 gap-y-1.5">
          {Object.values(CATS).map((c) => (
            <span key={c.label} className="inline-flex items-center gap-1.5 text-[11px] font-bold text-muted">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: c.color }}></span>{c.label}
            </span>
          ))}
        </div>

        <div className="p-4 space-y-2.5">
          {list.length === 0 && (
            <div className="text-center py-16">
              <div className="grid place-items-center rounded-2xl bg-surface-2 mx-auto mb-3" style={{ width: 56, height: 56 }}><Icon name="checkCircle" size={28} className="text-[var(--ok)]" /></div>
              <p className="text-ink font-semibold text-[15px]">¡Todo al día!</p>
              <p className="text-faint text-[13px] mt-1">No tienes notificaciones pendientes.</p>
            </div>
          )}
          {list.map((n) => {
            const u = URGENCY[n.urgencia];
            const cat = CATS[n.categoria] || CATS.general;
            const color = cat.color;
            return (
              <div key={n.id} className="group relative bg-surface border border-line rounded-2xl p-3.5 shadow-card hover:shadow-float transition-all duration-300 overflow-hidden anim-fade-up">
                <div className="absolute left-0 top-0 bottom-0 w-1" style={{ background: color }}></div>
                <div className="flex items-start gap-3 pl-1.5">
                  <div className="grid place-items-center rounded-xl shrink-0 mt-0.5" style={{ width: 34, height: 34, background: `color-mix(in srgb, ${color} 14%, transparent)` }}>
                    <Icon name={cat.icon} size={16} style={{ color }} />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 mb-0.5 min-w-0">
                      <span className="text-[10.5px] font-bold tracking-wide uppercase whitespace-nowrap" style={{ color }}>{cat.label} · {n.tipo}</span>
                      <span className="text-faint text-[11px] whitespace-nowrap truncate">· {n.tiempo}</span>
                    </div>
                    <p className="text-ink font-semibold text-[13.5px] leading-snug">{n.titulo}</p>
                    <p className="text-muted text-[12.5px] leading-snug mt-1">{n.detalle}</p>
                    <button onClick={() => n.curso ? onCourse(n.curso, n.tipo === 'Asistencia' ? 'asistencia' : null) : onNavigate('ayuda')} className="mt-2 text-[12.5px] font-bold text-primary inline-flex items-center gap-1 hover:gap-1.5 transition-all whitespace-nowrap">
                      {n.accion} <Icon name="arrowRight" size={13} />
                    </button>
                  </div>
                  <button onClick={() => onDismiss(n.id)} aria-label="Descartar" className="opacity-0 group-hover:opacity-100 transition-opacity text-faint hover:text-high grid place-items-center rounded-lg hover:bg-high-soft shrink-0" style={{ width: 28, height: 28 }}>
                    <Icon name="close" size={15} />
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </Sheet>
  );
}

// ---- Panel de Tweaks ----
function TweaksUI({ t, setTweak }) {
  const { TweaksPanel, TweakSection, TweakRadio, TweakColor } = window;
  if (!TweaksPanel) return null;
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Tema" />
      <TweakRadio label="Apariencia" value={t.theme} options={['Claro', 'Oscuro']} onChange={(v) => setTweak('theme', v)} />
      <TweakColor label="Color primario" value={t.primary} options={PRIMARY_OPTS} onChange={(v) => setTweak('primary', v)} />
      <TweakSection label="Tipografía" />
      <TweakRadio label="Estilo" value={t.font} options={['Editorial', 'Moderno', 'Geométrico']} onChange={(v) => setTweak('font', v)} />
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
